name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: 24
          cache: true
      - run: vp install --frozen-lockfile
      # Type-aware checks resolve league imports against the pinned Showdown
      # checkout, so restore it before vp check.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: packages/league/pokemon-showdown
          key: showdown-${{ hashFiles('packages/league/showdown.lock.json') }}
      - run: node tools/setup-showdown.mjs
        working-directory: packages/league
      # Site typechecks resolve league/server and league/protocol against
      # dist/, so the league must build before any cross-package check.
      - run: vp run league#build
      - run: vp check
      - run: vp run league#check
      - run: vp run site#test
      - run: vp run worlds#test
      - run: vp run league#test:unit
      - run: vp run site#build
      - run: vp run worlds#build
      # The live-watch surface is dev-only; fail if any trace ships.
      - run: "! grep -rl 'api/watch' apps/site/dist/"

  deploy:
    # Deploys only land from main after verification. Requires the
    # CLOUDFLARE_API_TOKEN repository secret (the "Edit Cloudflare Workers"
    # token template covers an assets-only Worker).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    # Queue rather than cancel so rapid pushes to main deploy in order.
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: 24
          cache: true
      - run: vp install --frozen-lockfile
      # The site build resolves league/protocol against dist/, which needs the
      # pinned Showdown checkout — same prerequisites as verify.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: packages/league/pokemon-showdown
          key: showdown-${{ hashFiles('packages/league/showdown.lock.json') }}
      - run: node tools/setup-showdown.mjs
        working-directory: packages/league
      - run: vp run league#build
      - run: vp run site#build
      - run: vp run worlds#build
      # The lockfile-pinned wrangler, same binary as a local deploy — not
      # whatever wrangler-action would fetch.
      - run: ./node_modules/.bin/wrangler deploy
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: ./node_modules/.bin/wrangler deploy
        working-directory: apps/worlds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
