name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: 24
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vp test
      - run: vp build

  deploy:
    # Deploys only land from main after verification. Requires the
    # CLOUDFLARE_API_TOKEN repository secret (the "Edit Cloudflare Workers"
    # token template covers an assets-only Worker).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    # Queue rather than cancel so rapid pushes to main deploy in order.
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: 24
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp build
      # The lockfile-pinned wrangler, same binary as a local deploy — not
      # whatever wrangler-action would fetch.
      - run: ./node_modules/.bin/wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
