name: format scoped memory

on:
  push:
    branches:
      - feat/scoped-agent-memory

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754
        with:
          node-version: 24
      - run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              file = Path(path)
              content = file.read_text()
              actual = content.count(old)
              if actual != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {actual}")
              file.write_text(content.replace(old, new, expected))

          path = "packages/league/src/llm-engine.ts"
          replace(
              path,
              '    this.notebook = normalizeStrategicMemory(options.initialNotebook?.trim() ?? "");\n    this.carryInNotebook = normalizeStrategicMemory(options.carryInNotebook?.trim() ?? "");\n',
              '    this.notebook = normalizeStrategicMemory(\n      options.initialNotebook?.trim() ?? "",\n      this.reference,\n    );\n    this.carryInNotebook = normalizeStrategicMemory(\n      options.carryInNotebook?.trim() ?? "",\n      this.reference,\n    );\n',
          )
          replace(
              path,
              '      this.notebook = normalizeStrategicMemory(row.notebook);\n',
              '      this.notebook = normalizeStrategicMemory(row.notebook, this.reference);\n',
          )

          path = "packages/league/tests/strategic-memory.test.ts"
          replace(
              path,
              '  parseStrategicMemory,\n  rememberVerifiedReference,\n',
              '  normalizeStrategicMemory,\n  parseStrategicMemory,\n  rememberVerifiedReference,\n',
          )
          replace(
              path,
              '    /team_playbook exceeds 3500 characters/,\n',
              '    /team_playbook is 3501 characters; limit 3500/,\n',
          )
          replace(
              path,
              '  const current = rememberVerifiedReference(first, {\n',
              '  assert.equal(\n    parseStrategicMemory(\n      normalizeStrategicMemory(first, { format: "format", revision: "current" }),\n    ).verifiedReferences.length,\n    0,\n  );\n  const current = rememberVerifiedReference(first, {\n',
          )
          PY
      - run: vp check --fix || true
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/league/src packages/league/tests
          git diff --cached --quiet || git commit -m "fix(league): finalize strategic memory scoping"
          git push
