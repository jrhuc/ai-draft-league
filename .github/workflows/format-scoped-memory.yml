name: format scoped memory

on:
  push:
    branches:
      - feat/scoped-agent-memory

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754
        with:
          node-version: 24
      - run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              file = Path(path)
              content = file.read_text()
              actual = content.count(old)
              if actual != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {actual}")
              file.write_text(content.replace(old, new, expected))

          replace(
              "packages/league/tests/engines-reflections.test.ts",
              '  assert.equal((traces[0]!.failed_attempts as unknown[])?.length, 1);\n',
              '  assert.equal(\n    Array.isArray(traces[0]!.failed_attempts) ? traces[0]!.failed_attempts.length : 0,\n    1,\n  );\n',
          )

          path = "packages/league/tests/engines.test.ts"
          replace(
              path,
              '  decision,\n  emptyStats,\n  oneMoveStats,\n  request,\n',
              '  decision,\n  emptyStats,\n  memory,\n  notebookUpdate,\n  oneMoveStats,\n  request,\n',
          )
          replace(path, '  assert.equal(engine.coachingNote(), "carried plan");\n', '  assert.equal(engine.coachingNote(), memory("", "carried plan"));\n')
          replace(
              path,
              '      responses: [JSON.stringify({ choices: [1], notebook: "  Revised plan.  " })],\n',
              '      responses: [\n        JSON.stringify({ choices: [1], notebook: notebookUpdate("  Revised plan.  ") }),\n      ],\n',
          )
          replace(path, '      expectedNotebook: "Revised plan.",\n', '      expectedNotebook: memory("Revised plan."),\n')
          replace(
              path,
              '      responses: [JSON.stringify({ choices: [1], rationale: "   ", notebook: "   " })],\n',
              '      responses: [\n        JSON.stringify({ choices: [1], rationale: "   ", notebook: notebookUpdate() }),\n      ],\n',
          )
          replace(
              path,
              '      name: "absent non-string evidence",\n      responses: [JSON.stringify({ choices: [1], rationale: null, notebook: false })],\n',
              '      name: "absent evidence",\n      responses: [JSON.stringify({ choices: [1], rationale: null })],\n',
          )
          replace(
              path,
              '      expectedNotebook: "Keep the current plan.",\n',
              '      expectedNotebook: memory("Keep the current plan."),\n',
              3,
          )
          replace(
              path,
              '  assert.equal(engine.coachingNote(), "Keep the current plan.");\n',
              '  assert.equal(engine.coachingNote(), memory("Keep the current plan."));\n',
          )
          replace(path, '      notebook: "n".repeat(1800),\n', '      notebook: notebookUpdate("", "n".repeat(1800)),\n')
          replace(
              path,
              '  assert.equal(\n    text(decisions[0]!.notebook).length,\n    1800,\n    "well under the notebook backstop, kept whole",\n  );\n',
              '  assert.equal(decisions[0]!.notebook, memory("", "n".repeat(1800)));\n',
          )
          replace(
              path,
              '  const reflection = JSON.stringify({ summary: "s", adjustment: "a", notebook: "n" });\n',
              '  const finalReflection = JSON.stringify({\n    summary: "s",\n    adjustment: "a",\n    notebook: { team_playbook: "n", series_memory: "" },\n  });\n  const midseriesReflection = JSON.stringify({\n    summary: "s",\n    adjustment: "a",\n    notebook: notebookUpdate("n"),\n  });\n',
          )
          replace(path, '  const draftFinal = new ScriptedProvider([reflection]);\n', '  const draftFinal = new ScriptedProvider([finalReflection]);\n')
          replace(path, '  const draftMidSeries = new ScriptedProvider([reflection]);\n', '  const draftMidSeries = new ScriptedProvider([midseriesReflection]);\n')
          replace(path, '  const constructedFinal = new ScriptedProvider([reflection]);\n', '  const constructedFinal = new ScriptedProvider([finalReflection]);\n')

          path = "packages/league/tests/engines-budgets-tools.test.ts"
          replace(
              path,
              'import { acceptedAct, decision, request, ScriptedProvider } from "./engine-test-helpers.js";\n',
              'import {\n  acceptedAct,\n  decision,\n  notebookUpdate,\n  request,\n  ScriptedProvider,\n} from "./engine-test-helpers.js";\n',
          )
          replace(path, '      notebook: "notes",\n', '      notebook: notebookUpdate("notes"),\n')

          path = "packages/league/tests/engines-submissions.test.ts"
          replace(
              path,
              '  emptyStats,\n  oneMoveStats,\n',
              '  emptyStats,\n  notebookUpdate,\n  oneMoveStats,\n',
          )
          replace(
              path,
              '    JSON.stringify({ summary: "s", adjustment: "a", notebook: "n" }),\n',
              '    JSON.stringify({ summary: "s", adjustment: "a", notebook: notebookUpdate("n") }),\n',
          )

          replace(
              "packages/league/tests/prompts.test.ts",
              '  assert.match(prompt, /only when durable plans changed.*notebook.*complete replacement/);\n',
              '  assert.match(prompt, /only when durable memory changed.*team_playbook.*complete replacement/);\n',
          )
          PY
      - run: vp check --fix || true
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/league/src packages/league/tests
          git diff --cached --quiet || git commit -m "test(league): migrate scoped memory fixtures"
          git push
