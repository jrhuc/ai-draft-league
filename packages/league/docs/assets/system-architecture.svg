<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">League system architecture</title>
  <desc id="desc">The CLI starts runDraftLeague. The orchestrator runs manager stages, recorded battle series, and run-file persistence. Model stages call the configured provider. Recorded series use the provider for battle choices and Pokémon Showdown for game authority. Run files are joined by buildLeague for local inspection or export to a season bundle consumed by AI Draft League.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 9 4.5 0 9Z" fill="#718078"/>
    </marker>
    <style>
      .group{fill:#f7f8f6;stroke:#d9dfdc;stroke-width:1.5}
      .box{fill:#fff;stroke:#cbd4cf;stroke-width:1.5}
      .primary{fill:#eef3ff;stroke:#7694d5;stroke-width:1.8}
      .external{fill:#f1f5f2;stroke:#9aaba2;stroke-width:1.5}
      .publish{fill:#fff8e9;stroke:#d6af57;stroke-width:1.5}
      .line{fill:none;stroke:#718078;stroke-width:1.8;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#718078;stroke-width:1.6;stroke-dasharray:6 5;marker-end:url(#arrow)}
      .label{font:700 12px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.08em;fill:#68766f}
      .title{font:700 18px Inter,ui-sans-serif,system-ui,sans-serif;fill:#14212b}
      .body{font:14px Inter,ui-sans-serif,system-ui,sans-serif;fill:#52616a}
      .small{font:12px Inter,ui-sans-serif,system-ui,sans-serif;fill:#68766f}
    </style>
  </defs>

  <rect width="1280" height="900" rx="18" fill="#fff"/>

  <rect class="box" x="430" y="32" width="420" height="68" rx="10"/>
  <text class="title" x="640" y="62" text-anchor="middle">CLI</text>
  <text class="small" x="640" y="82" text-anchor="middle">start, resume, inspect, cancel, export</text>

  <rect class="group" x="50" y="140" width="1180" height="350" rx="16"/>
  <text class="label" x="78" y="170">HARNESS</text>
  <rect class="primary" x="430" y="188" width="420" height="72" rx="10"/>
  <text class="title" x="640" y="220" text-anchor="middle">runDraftLeague</text>
  <text class="small" x="640" y="241" text-anchor="middle">owns phase order, resume, and cancellation</text>

  <rect class="box" x="86" y="330" width="324" height="112" rx="10"/>
  <text class="title" x="248" y="359" text-anchor="middle">Franchise manager stages</text>
  <text class="body" x="248" y="384" text-anchor="middle">draft · weekly review · transactions</text>
  <text class="body" x="248" y="406" text-anchor="middle">team build · season review</text>
  <text class="small" x="248" y="426" text-anchor="middle">explicit calls, not autonomous agents</text>

  <rect class="box" x="478" y="330" width="324" height="112" rx="10"/>
  <text class="title" x="640" y="359" text-anchor="middle">playRecordedSeries</text>
  <text class="body" x="640" y="384" text-anchor="middle">battle pilot choices and best-of-three state</text>
  <text class="small" x="640" y="408" text-anchor="middle">records accepted decisions and game evidence</text>

  <rect class="box" x="870" y="330" width="324" height="112" rx="10"/>
  <text class="title" x="1032" y="359" text-anchor="middle">Run files</text>
  <text class="body" x="1032" y="384" text-anchor="middle">config, rosters, reviews, builds, series</text>
  <text class="small" x="1032" y="408" text-anchor="middle">append-only decisions and completion artifacts</text>

  <path class="line" d="M640 100V188"/>
  <path class="line" d="M560 260V292H248V330"/>
  <path class="line" d="M640 260V330"/>
  <path class="line" d="M720 260V292H1032V330"/>

  <text class="label" x="78" y="542">EXTERNAL AUTHORITY AND READ MODEL</text>
  <rect class="external" x="86" y="570" width="324" height="92" rx="10"/>
  <text class="title" x="248" y="604" text-anchor="middle">Model provider</text>
  <text class="body" x="248" y="630" text-anchor="middle">manager, builder, and battle pilot calls</text>

  <rect class="external" x="478" y="570" width="324" height="92" rx="10"/>
  <text class="title" x="640" y="604" text-anchor="middle">Pokémon Showdown</text>
  <text class="body" x="640" y="630" text-anchor="middle">legality, game state, randomness, results</text>

  <rect class="primary" x="870" y="570" width="324" height="92" rx="10"/>
  <text class="title" x="1032" y="604" text-anchor="middle">buildLeague</text>
  <text class="body" x="1032" y="630" text-anchor="middle">joins run files into the operator read model</text>

  <path class="line" d="M248 442V570"/>
  <path class="dash" d="M540 442V520H330V570"/>
  <path class="line" d="M640 442V570"/>
  <path class="line" d="M1032 442V570"/>

  <rect class="box" x="682" y="724" width="244" height="76" rx="10"/>
  <text class="title" x="804" y="756" text-anchor="middle">Local inspection</text>
  <text class="small" x="804" y="778" text-anchor="middle">CLI archive views</text>

  <rect class="primary" x="964" y="724" width="244" height="76" rx="10"/>
  <text class="title" x="1086" y="756" text-anchor="middle">exportSeasonBundle</text>
  <text class="small" x="1086" y="778" text-anchor="middle">validates the release boundary</text>

  <path class="line" d="M1032 662V690H804V724"/>
  <path class="line" d="M1032 662V690H1086V724"/>

  <rect class="publish" x="408" y="816" width="244" height="60" rx="10"/>
  <text class="title" x="530" y="852" text-anchor="middle">ai-draft-league</text>
  <rect class="publish" x="786" y="816" width="244" height="60" rx="10"/>
  <text class="title" x="908" y="843" text-anchor="middle">season-bundle.json</text>
  <text class="small" x="908" y="862" text-anchor="middle">public released evidence only</text>

  <path class="line" d="M1086 800V846H1030"/>
  <path class="line" d="M786 846H652"/>
</svg>
