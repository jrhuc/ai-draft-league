<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Franchise manager calls across a season</title>
  <desc id="desc">A franchise manager's identity and memory inform the draft, matchup builder, weekly review, transactions, and season review. The matchup builder produces a team and plan for the battle pilot. Pokémon Showdown resolves pilot choices into results. Results feed the weekly review. During the first three weeks, transactions can update the roster and trigger a memory reconciliation before the next build.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 9 4.5 0 9Z" fill="#718078"/>
    </marker>
    <style>
      .state{fill:#fff;stroke:#cbd4cf;stroke-width:1.5}
      .call{fill:#eef3ff;stroke:#7694d5;stroke-width:1.8}
      .authority{fill:#f1f5f2;stroke:#9aaba2;stroke-width:1.5}
      .season{fill:#fff8e9;stroke:#d6af57;stroke-width:1.5}
      .line{fill:none;stroke:#718078;stroke-width:1.8;marker-end:url(#arrow)}
      .soft{fill:none;stroke:#718078;stroke-width:1.6;stroke-dasharray:6 5;marker-end:url(#arrow)}
      .title{font:700 18px Inter,ui-sans-serif,system-ui,sans-serif;fill:#14212b}
      .body{font:14px Inter,ui-sans-serif,system-ui,sans-serif;fill:#52616a}
      .small{font:12px Inter,ui-sans-serif,system-ui,sans-serif;fill:#68766f}
      .label{font:700 12px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.08em;fill:#68766f}
      .edge{font:12px Inter,ui-sans-serif,system-ui,sans-serif;fill:#68766f}
    </style>
  </defs>

  <rect width="1280" height="820" rx="18" fill="#fff"/>
  <text class="label" x="54" y="42">PERSISTENT FRANCHISE STATE</text>

  <rect class="state" x="54" y="70" width="250" height="88" rx="10"/>
  <text class="title" x="179" y="104" text-anchor="middle">Current roster</text>
  <text class="body" x="179" y="130" text-anchor="middle">10 drafted or acquired entries</text>

  <rect class="state" x="54" y="246" width="250" height="108" rx="10"/>
  <text class="title" x="179" y="282" text-anchor="middle">Manager identity + memory</text>
  <text class="body" x="179" y="308" text-anchor="middle">private state carried across stages</text>
  <text class="small" x="179" y="332" text-anchor="middle">not a long-lived provider chat</text>

  <rect class="call" x="360" y="70" width="220" height="88" rx="10"/>
  <text class="title" x="470" y="104" text-anchor="middle">Draft call</text>
  <text class="body" x="470" y="130" text-anchor="middle">picks roster and starts memory</text>

  <path class="line" d="M304 278H330V140H360"/>
  <path class="line" d="M360 106H304"/>

  <text class="label" x="360" y="222">WEEKLY MATCHUP LOOP</text>

  <rect class="call" x="360" y="246" width="220" height="108" rx="10"/>
  <text class="title" x="470" y="282" text-anchor="middle">Matchup builder call</text>
  <text class="body" x="470" y="308" text-anchor="middle">reads roster, opponent, and memory</text>
  <text class="small" x="470" y="332" text-anchor="middle">registers six legal sets</text>

  <rect class="state" x="636" y="246" width="200" height="108" rx="10"/>
  <text class="title" x="736" y="282" text-anchor="middle">Team + plan</text>
  <text class="body" x="736" y="308" text-anchor="middle">one matchup only</text>
  <text class="small" x="736" y="332" text-anchor="middle">includes a series notebook</text>

  <rect class="call" x="892" y="246" width="220" height="108" rx="10"/>
  <text class="title" x="1002" y="282" text-anchor="middle">Battle pilot calls</text>
  <text class="body" x="1002" y="308" text-anchor="middle">choose from legal actions</text>
  <text class="small" x="1002" y="332" text-anchor="middle">using visible battle requests</text>

  <path class="line" d="M304 300H360"/>
  <path class="line" d="M179 158V202H410V246"/>
  <path class="line" d="M580 300H636"/>
  <path class="line" d="M836 300H892"/>

  <rect class="authority" x="892" y="418" width="220" height="88" rx="10"/>
  <text class="title" x="1002" y="452" text-anchor="middle">Pokémon Showdown</text>
  <text class="body" x="1002" y="478" text-anchor="middle">resolves each game</text>

  <rect class="state" x="636" y="418" width="200" height="88" rx="10"/>
  <text class="title" x="736" y="452" text-anchor="middle">Series results</text>
  <text class="body" x="736" y="478" text-anchor="middle">score, logs, and notes</text>

  <rect class="call" x="360" y="418" width="220" height="88" rx="10"/>
  <text class="title" x="470" y="452" text-anchor="middle">Weekly review call</text>
  <text class="body" x="470" y="478" text-anchor="middle">revises franchise memory</text>

  <path class="line" d="M1002 354V418"/>
  <path class="line" d="M892 462H836"/>
  <path class="line" d="M636 462H580"/>
  <path class="line" d="M360 462H326V336H304"/>

  <text class="label" x="360" y="584">AFTER WEEKS 1, 2, AND 3</text>

  <rect class="call" x="360" y="608" width="220" height="96" rx="10"/>
  <text class="title" x="470" y="642" text-anchor="middle">Transaction calls</text>
  <text class="body" x="470" y="668" text-anchor="middle">trade offers and free agency</text>
  <text class="small" x="470" y="690" text-anchor="middle">may leave the roster unchanged</text>

  <rect class="call" x="54" y="608" width="250" height="96" rx="10"/>
  <text class="title" x="179" y="642" text-anchor="middle">Reconciliation call</text>
  <text class="body" x="179" y="668" text-anchor="middle">runs only after a roster change</text>
  <text class="small" x="179" y="690" text-anchor="middle">updates memory before the next build</text>

  <path class="line" d="M470 506V608"/>
  <path class="line" d="M360 632H330V114H304"/>
  <path class="line" d="M360 676H304"/>
  <path class="line" d="M179 608V354"/>

  <rect class="season" x="748" y="608" width="364" height="96" rx="10"/>
  <text class="title" x="930" y="642" text-anchor="middle">Season review call</text>
  <text class="body" x="930" y="668" text-anchor="middle">uses final results, roster, and memory</text>
  <text class="small" x="930" y="690" text-anchor="middle">runs when that franchise's season ends</text>

  <path class="soft" d="M736 506V560H930V608"/>
  <path class="soft" d="M304 330H320V758H930V704"/>

  <text class="edge" x="485" y="556">scheduled window</text>
  <text class="edge" x="752" y="548">season ending</text>
</svg>
