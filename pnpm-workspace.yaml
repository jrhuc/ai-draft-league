packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@parcel/watcher": false
  esbuild: true
  fsevents: true
  msgpackr-extract: false
  protobufjs: false
  tree-sitter-bash: false
  tree-sitter-powershell: false
  workerd: true

minimumReleaseAgeExclude:
  - "@opencode/*"
  - ai
  - "@ai-sdk/*"
  - "@voidzero-dev/vite-plus-*"
  - vite-plus
  - oxlint
  - oxlint-tsgolint
  - "@oxlint/*"
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - "@oxc-project/*"
  - "@vitest/*"
  - vitest
  - wrangler
  - miniflare
  - workerd
  - "@cloudflare/*"
  - unenv
  - react
  - react-dom
  - scheduler
  - "@types/react"
  - "@types/react-dom"
  - "@types/node"
  - happy-dom
  - zod

catalog:
  "@fontsource-variable/geist": 5.3.0
  "@fontsource-variable/geist-mono": 5.3.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.1
  happy-dom: 20.14.5
  react: 19.3.0
  react-dom: 19.3.0
  react-router-dom: 7.18.4
  vite: "npm:@voidzero-dev/vite-plus-core@1.0.0"
  vite-plus: 1.0.0
  wrangler: 4.147.0
  zod: 4.6.5

overrides:
  "vite@*": "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
