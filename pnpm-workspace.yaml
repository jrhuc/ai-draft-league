packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@google/genai": false
  "@parcel/watcher": false
  esbuild: true
  fsevents: true
  msgpackr-extract: false
  protobufjs: false
  tree-sitter-bash: false
  tree-sitter-powershell: false
  workerd: true

minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-*"
  - vite-plus
  - oxlint
  - oxlint-tsgolint
  - "@oxlint/*"
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - "@oxc-project/*"
  - "@vitest/*"
  - vitest
  - wrangler
  - miniflare
  - workerd
  - "@cloudflare/*"
  - unenv
  - react
  - react-dom
  - scheduler
  - "@types/react"
  - "@types/react-dom"
  - "@types/node"
  - happy-dom
  - zod

catalog:
  "@fontsource-variable/geist": 5.3.0
  "@fontsource-variable/geist-mono": 5.3.0
  "@types/node": 26.6.6
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.2.1
  happy-dom: 21.0.4
  react: 19.3.1
  react-dom: 19.3.1
  react-router-dom: 7.18.5
  vite: npm:@voidzero-dev/vite-plus-core@1.5.1
  vite-plus: 1.5.1
  wrangler: 4.159.0
  zod: 4.6.7

overrides:
  "vite@*": "catalog:"
  "@types/node@*": "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
