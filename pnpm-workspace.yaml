packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  fsevents: true
  workerd: true

minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-*"
  - vite-plus
  - oxlint
  - oxlint-tsgolint
  - "@oxlint/*"
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - "@oxc-project/*"
  - "@vitest/*"
  - vitest
  - wrangler
  - miniflare
  - workerd
  - "@cloudflare/*"
  - unenv
  - react
  - react-dom
  - scheduler
  - "@types/react"
  - "@types/react-dom"
  - "@types/node"
  - happy-dom
  - zod

overrides:
  vite@*: "catalog:"
  "@types/node@*": 26.6.5
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
